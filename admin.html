<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foncestas — Administração</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f7f4f1;color:#333}.wrap{max-width:1100px;margin:40px auto;padding:20px}.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 20px #0001;margin-bottom:20px}input,textarea,button{font:inherit;padding:12px;border:1px solid #ddd;border-radius:10px}input,textarea{width:100%;box-sizing:border-box;margin:6px 0 14px}button{cursor:pointer;background:#4E95A0;color:#fff;border:0}.danger{background:#b44}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #eee}.msg{padding:10px;border-radius:8px;background:#f2f2f2;margin:10px 0}@media(max-width:700px){.row{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap">
<div id="login" class="card"><h1>Área administrativa</h1><p>Acesso exclusivo da administração Foncestas.</p><label>E-mail</label><input id="email" type="email" autocomplete="email"><label>Senha</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">Entrar</button> <button id="resetBtn" type="button">Esqueci minha senha</button><div id="loginMsg" class="msg"></div></div>
<div id="app" class="hidden"><div class="card top"><div><h1>Painel Foncestas</h1><p>Catálogo e conteúdo do site</p></div><button id="logout">Sair</button></div>
<div class="card"><h2>Produto</h2><input id="pid" type="hidden"><div class="row"><div><label>Nome</label><input id="name"></div><div><label>Preço</label><input id="price" type="number" step="0.01" min="0"></div></div><label>Categoria</label><input id="category"><label>Descrição</label><textarea id="description"></textarea><label>URL da imagem</label><input id="image_url" type="url"><label><input id="active" type="checkbox" checked style="width:auto"> Produto ativo</label><br><button id="save">Salvar produto</button> <button id="clear" type="button">Novo</button><div id="saveMsg" class="msg"></div></div>
<div class="card"><h2>Produtos</h2><div id="products">Carregando...</div></div>
<div class="card"><h2>Conteúdo editável</h2><p>Use esta área para textos administrativos futuros.</p><input id="ckey" placeholder="chave (ex.: banner_titulo)"><textarea id="cvalue" placeholder="conteúdo"></textarea><button id="saveContent">Salvar conteúdo</button><div id="contentMsg" class="msg"></div></div>
</div></div>
<script>
const URL='https://kkzooervozgdtgpznbne.supabase.co';
const KEY='sb_publishable_Ov8X4_C09EuJWUD1LIN9wg_pnSwyqPu';
const sb=supabase.createClient(URL,KEY); const ADMIN='larissafonseca4494@gmail.com';
const $=id=>document.getElementById(id); const msg=(id,t)=>$(id).textContent=t;
async function ensure(){const {data:{user}}=await sb.auth.getUser(); if(!user){$('login').classList.remove('hidden');$('app').classList.add('hidden');return false} if((user.email||'').toLowerCase()!==ADMIN){await sb.auth.signOut();msg('loginMsg','Acesso não autorizado.');return false} $('login').classList.add('hidden');$('app').classList.remove('hidden');load();return true}
$('loginBtn').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});msg('loginMsg',error?error.message:'Entrando...');if(!error)ensure()};
$('resetBtn').onclick=async()=>{const e=$('email').value.trim();if(!e){msg('loginMsg','Informe seu e-mail primeiro.');return}const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});msg('loginMsg',error?error.message:'Se o e-mail existir, enviamos as instruções de recuperação.')};
$('logout').onclick=()=>sb.auth.signOut().then(ensure);$('clear').onclick=()=>{['pid','name','price','category','description','image_url'].forEach(x=>$(x).value='');$('active').checked=true};
async function load(){const {data,error}=await sb.from('products').select('*').order('created_at',{ascending:false});if(error){msg('products',error.message);return}if(!data.length){$('products').innerHTML='<p>Nenhum produto cadastrado.</p>';return}$('products').innerHTML='<table><tr><th>Produto</th><th>Preço</th><th>Categoria</th><th></th></tr>'+data.map(p=>`<tr><td>${esc(p.name)}</td><td>R$ ${Number(p.price).toFixed(2).replace('.',',')}</td><td>${esc(p.category||'')}</td><td><button onclick="edit('${p.id}')">Editar</button></td></tr>`).join('')+'</table>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
window.edit=async id=>{const {data,error}=await sb.from('products').select('*').eq('id',id).single();if(error){msg('saveMsg',error.message);return}$('pid').value=data.id;$('name').value=data.name;$('price').value=data.price;$('category').value=data.category||'';$('description').value=data.description||'';$('image_url').value=data.image_url||'';$('active').checked=data.is_active};
$('save').onclick=async()=>{const p={name:$('name').value.trim(),slug:($('name').value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||crypto.randomUUID()),price:Number($('price').value||0),category:$('category').value.trim(),description:$('description').value,image_url:$('image_url').value.trim(),is_active:$('active').checked};let r;if($('pid').value)r=await sb.from('products').update(p).eq('id',$('pid').value);else r=await sb.from('products').insert(p);msg('saveMsg',r.error?r.error.message:'Produto salvo com sucesso.');if(!r.error){$('clear').click();load()}};
$('saveContent').onclick=async()=>{const k=$('ckey').value.trim();if(!k)return msg('contentMsg','Informe uma chave.');const {error}=await sb.from('site_content').upsert({content_key:k,content_value:$('cvalue').value},{onConflict:'content_key'});msg('contentMsg',error?error.message:'Conteúdo salvo.')};
sb.auth.onAuthStateChange(()=>ensure()); ensure();
</script></body></html>
